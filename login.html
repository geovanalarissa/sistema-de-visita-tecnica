<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitas Técnicas - Login</title>
  
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <!-- Lado Esquerdo: Apresentação -->
    <div class="login-banner">
      <div class="brand-logo-container">
        <img src="img/logo (2).png" alt="Visitas Técnicas" class="brand-logo" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='inline-block';">
        <i id="fallback-icon" class="bi bi-shield-check brand-fallback-icon" style="display:none;"></i>
        <h1>Visitas Técnicas</h1>
      </div>
      
      <p class="brand-desc">Organização e controle das visitas do técnico.</p>

      <ul class="login-features">
        <li><i class="bi bi-calendar-event"></i> Agende visitas</li>
        <li><i class="bi bi-check-circle"></i> Acompanhe o andamento</li>
        <li><i class="bi bi-pencil-square"></i> Edite quando precisar</li>
        <li><i class="bi bi-shield-lock"></i> Mais praticidade no seu dia a dia</li>
      </ul>
    </div>

    <!-- Lado Direito: Formulário -->
    <div class="login-box">
      <h2>Entrar</h2>
      <p class="subtitle">Acesse sua conta para continuar</p>

      <form id="formLogin">
        <div class="field-group">
          <i class="bi bi-person field-icon"></i>
          <input type="text" id="userInput" placeholder="Usuário" required>
        </div>

        <div class="field-group">
          <i class="bi bi-lock field-icon"></i>
          <input type="password" id="passwordInput" placeholder="Senha" required>
          <button type="button" class="btn-toggle-pass" id="btnTogglePass">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

        <div class="form-links">
          <a href="#" class="forgot-link">Esqueceu sua senha?</a>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
